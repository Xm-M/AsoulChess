<head>

  <title>10.2 Demo 打卡日程</title>

    :root {

      --line: #d9d0c2;
      --stamp: #c4452f;

      --prog: #3b6ea5;

      --art: #6b4ea3;

      --check: #8b2e22;

    html, body { margin: 0; min-height: 100%; }
    body {

      background: #cfc4b2;
      color: var(--ink);
    }
    .page {
      max-width: 1180px;
      margin: 24px auto;

      background: var(--paper);
      box-shadow: 0 12px 40px rgba(60, 40, 20, .22);
      border: 1px solid #e7ddcd;
    }
    header h1 {

      font-size: 28px;
      letter-spacing: .04em;
    }
    header p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
    .meta {
      display: flex; flex-wrap: wrap; gap: 10px 18px;
      margin: 14px 0 18px; font-size: 14px;
    }
    .meta b { font-variant-numeric: tabular-nums; }
    .bar {
      height: 10px; background: #e6ddd0; border-radius: 99px; overflow: hidden;
      margin-bottom: 18px;
    }
    .bar > i {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #c4452f, #e08a3c);
      transition: width .25s;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin-bottom: 16px;
    }
    button, select {
      font: inherit; color: var(--ink);
      background: #fffaf2; border: 1px solid #cbbda8;
      border-radius: 6px; padding: 6px 10px; cursor: pointer;
    }
    button:hover { background: #fff; }
    .hint { font-size: 12px; color: var(--muted); }
    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 22px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      .page { margin: 0; padding: 16px; }
    }
    .month { margin-bottom: 18px; }
    .month h2 { margin: 0 0 8px; font-size: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .dow, .cell {
      min-height: 54px;
      border-radius: 8px;
      font-size: 12px;
    }
    .dow {
      min-height: 0; text-align: center; color: var(--muted);
      font-weight: 600; padding: 2px 0;
    }
    .cell {
      background: #fffdf8;
      border: 1px solid var(--line);
      padding: 6px 7px;
      position: relative;
    }
    .cell.empty { background: transparent; border: none; }
    .cell.weekend {
      background: #eee8dc; color: var(--muted); cursor: default;
    }
    .cell.artday {
      background: #f3eef8;
      border-color: #d4c6e4;
    }
    .cell.work { cursor: pointer; }
    .cell.work:hover { border-color: #b9a78c; }
    .cell.today { box-shadow: inset 0 0 0 2px var(--today); }
    .cell.done {
      background: #f8ece6;
      border-color: #e0b3a8;
    }
    .cell.selected { outline: 2px solid var(--stamp); }
    .cell .d { font-weight: 700; font-size: 14px; }
    .cell .p { color: var(--muted); margin-top: 2px; }
    .cell .stamp {
      position: absolute; right: 4px; top: 4px;
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--stamp); color: var(--stamp);
      font-size: 10px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      transform: rotate(-12deg); opacity: .9;
    }
    .cell.weekend .tag { font-size: 11px; }
    .panel {
      background: #fffdf8;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 16px 12px;
      position: sticky; top: 12px;
    }
    .panel h3 { margin: 0 0 4px; font-size: 18px; }
    .goal {
      background: #f7f0e4; border-left: 3px solid var(--stamp);
      padding: 8px 10px; margin: 10px 0 12px; font-size: 13px;
    }
    .task {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--line);
    }
    .task:last-child { border-bottom: none; }
    .task input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--stamp); }
    .task.checked .title { text-decoration: line-through; color: var(--muted); }
    .role {
      display: inline-block; font-size: 11px; font-weight: 700;
      padding: 1px 6px; border-radius: 99px; color: #fff; margin-right: 6px;

    .role.程序 { background: var(--prog); }
    .role.单位 { background: var(--unit); }
    .role.内容 { background: var(--content); }
    .role.美术 { background: var(--art); }
    .role.策划 { background: var(--plan); }
    .role.验收 { background: var(--check); }
    .title { font-size: 14px; font-weight: 650; line-height: 1.4; }
    .how { margin: 4px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .legend { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.7; }
    .cut {
      margin-top: 22px; font-size: 13px; color: var(--muted);
      border-top: 1px dashed var(--line); padding-top: 12px;
    }
    .cut b { color: var(--ink); }
  </style>
</head>

const byDate = Object.fromEntries(DAYS.map((d) => [d.date, d]));
const state = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || "{}"); }
  catch { return {}; }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

function pad(n) { return String(n).padStart(2, "0"); }
function iso(y, m, d) { return `${y}-${pad(m)}-${pad(d)}`; }
function parseIso(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function todayIso() {
  const t = new Date();
  return iso(t.getFullYear(), t.getMonth() + 1, t.getDate());
}
function taskKey(date, i) { return `${date}#${i}`; }
function dayStats(day) {
  const n = day.tasks.length;
  let c = 0;
  day.tasks.forEach((_, i) => { if (state[taskKey(day.date, i)]) c++; });
  return { n, c, done: n > 0 && c === n };
}

function renderCalendars() {
  const root = document.getElementById("calendars");
  root.innerHTML = "";
  [
    { y: 2026, m: 8, title: "2026 年 8 月" },
    { y: 2026, m: 9, title: "2026 年 9 月" },
    { y: 2026, m: 10, title: "2026 年 10 月（只到 2 号）" }
  ].forEach((month) => root.appendChild(renderMonth(month)));
}

function renderMonth({ y, m, title }) {
  const wrap = document.createElement("section");
  wrap.className = "month";
  wrap.innerHTML = `<h2>${title}</h2>`;
  const grid = document.createElement("div");
  grid.className = "grid";
  ["一","二","三","四","五","六","日"].forEach((w) => {
    const el = document.createElement("div");
    el.className = "dow";
    el.textContent = w;
    grid.appendChild(el);
  });
  const first = new Date(y, m - 1, 1);
  const lastDate = new Date(y, m, 0).getDate();
  let mon0 = first.getDay() === 0 ? 6 : first.getDay() - 1;
  for (let i = 0; i < mon0; i++) {
    const el = document.createElement("div");
    el.className = "cell empty";
    grid.appendChild(el);
  }
  const selected = document.querySelector(".cell.selected")?.dataset.date;
  const tIso = todayIso();
  for (let d = 1; d <= lastDate; d++) {
    if (m === 10 && d > 2) break;
    const date = iso(y, m, d);
    const dt = new Date(y, m - 1, d);
    const weekend = dt.getDay() === 0 || dt.getDay() === 6;
    const day = byDate[date];
    const el = document.createElement("div");
    el.className = "cell";
    el.dataset.date = date;
    if (weekend && !day) {
      el.classList.add("weekend");
      el.innerHTML = `<div class="d">${d}</div><div class="tag">缓冲</div>`;
    } else if (day) {
      const st = dayStats(day);
      el.classList.add("work");
      if (day.artWeekend) el.classList.add("artday");
      if (date === tIso) el.classList.add("today");
      if (st.done) el.classList.add("done");
      if (date === selected) el.classList.add("selected");
      el.innerHTML = `<div class="d">${d}${day.milestone ? " ★" : ""}${day.artWeekend ? " 画" : ""}</div>
        <div class="p">${st.c}/${st.n}</div>
        ${st.done ? `<span class="stamp">完</span>` : ""}`;
      el.addEventListener("click", () => openDay(date));
    } else {
      el.classList.add("weekend");
      el.innerHTML = `<div class="d">${d}</div>`;
    }
    grid.appendChild(el);
  }
  wrap.appendChild(grid);
  return wrap;
}

function openDay(date) {
  const day = byDate[date];
  if (!day) return;
  document.querySelectorAll(".cell.selected").forEach((el) => el.classList.remove("selected"));
  document.querySelector(`.cell[data-date="${date}"]`)?.classList.add("selected");
  const dt = parseIso(date);
  const weekNames = ["日","一","二","三","四","五","六"];
  const st = dayStats(day);
  const panel = document.getElementById("panel");
  panel.innerHTML = `
    <h3>${date.slice(5).replace("-", "/")} 周${weekNames[dt.getDay()]}${day.milestone ? " · 周五验收" : ""}${day.artWeekend ? " · 画角色图" : ""}</h3>
    <div class="hint">${day.week}　${st.c} / ${st.n} 已打卡</div>
    <div class="goal"><b>今天要做到：</b>${day.goal}</div>
    <div id="tasks"></div>
  `;
  const box = panel.querySelector("#tasks");
  day.tasks.forEach((task, i) => {
    const key = taskKey(date, i);
    const row = document.createElement("label");
    row.className = "task" + (state[key] ? " checked" : "");
    row.innerHTML = `
      <input type="checkbox" ${state[key] ? "checked" : ""} />
      <div>
        <div class="title"><span class="role ${task.role}">${task.role}</span>${task.title}</div>
        <div class="how">打勾标准：${task.how}</div>
      </div>
    `;
    const input = row.querySelector("input");
    input.addEventListener("change", () => {
      if (input.checked) state[key] = true;
      else delete state[key];
      save();
      refresh();
      openDay(date);
    });
    box.appendChild(row);
  });
}

function refreshMeta() {
  let total = 0, done = 0, daysDone = 0;
  DAYS.forEach((day) => {
    const st = dayStats(day);
    total += st.n;
    done += st.c;
    if (st.done) daysDone++;
  });
  document.getElementById("overall").textContent = `${done} / ${total}`;
  document.getElementById("daysDone").textContent = `${daysDone} / ${DAYS.length}`;
  document.getElementById("bar").style.width = (total ? (done / total * 100) : 0) + "%";
  const t = new Date();
  t.setHours(0,0,0,0);
  const left = Math.ceil((SHIP - t) / 86400000);
  document.getElementById("left").textContent = String(left);
  const tIso = todayIso();
  document.getElementById("todayLabel").textContent = byDate[tIso]
    ? `今天 ${tIso.slice(5)} 有任务`
    : `今天 ${tIso.slice(5)} 无排期（周末缓冲或已过发版）`;
}

function refresh() {
  const keep = document.querySelector(".cell.selected")?.dataset.date;
  renderCalendars();
  refreshMeta();
  if (keep && byDate[keep]) {
    document.querySelector(`.cell[data-date="${keep}"]`)?.classList.add("selected");
  }
}

function jumpToday() {
  const t = todayIso();
  if (byDate[t]) openDay(t);
  else {
    const next = DAYS.find((d) => d.date >= t) || DAYS[DAYS.length - 1];
    openDay(next.date);
  }
}

document.getElementById("btnToday").onclick = jumpToday;
document.getElementById("btnReset").onclick = () => {
  if (!confirm("清空本机全部打卡？")) return;
  Object.keys(state).forEach((k) => delete state[k]);
  save();
  refresh();
  jumpToday();
};
document.getElementById("btnExport").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "oct2-punch.json";
  a.click();
};
document.getElementById("btnImport").onclick = () => {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json";
  inp.onchange = () => {
    const file = inp.files[0];
    if (!file) return;
    file.text().then((text) => {
      Object.keys(state).forEach((k) => delete state[k]);
      Object.assign(state, JSON.parse(text));
      save();
      refresh();
      jumpToday();
    });
  };
  inp.click();
};

refresh();
jumpToday();
</script>
